<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UD3 · ODS y desempeño profesional · MotorBalear S.L.</title>
<style>
:root{--b:#0b5cad;--bl:#e7f0fb;--g:#2b8a3e;--r:#c92a2a;--o:#e8590c;--bg:#f3f5f8;--t:#1d2733;--m:#5c6b7a;--l:#d9e0e8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--l);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header b{color:var(--b)}.m{color:var(--m);font-size:.85rem}.k{color:var(--m);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
#sv{font-size:.8rem;color:var(--g);min-width:76px}
select,button,input,textarea{font:inherit}
button,select{font-size:.86rem;border:1px solid var(--b);background:#fff;color:var(--b);border-radius:8px;padding:8px 11px;cursor:pointer;min-height:40px}
button:hover{background:var(--bl)}button.p{background:var(--b);color:#fff}button.sm{padding:5px 9px;min-height:34px}
.bar{flex:1;min-width:80px;height:8px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);width:0;transition:.3s}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1300px;margin:auto;padding:16px}
main,aside{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px}
aside{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;font-size:.88rem}
aside h4{margin:14px 0 4px;color:var(--b);border-bottom:1px solid var(--l);font-size:.9rem}
aside ul{margin:4px 0 8px 18px;padding:0}
h2{margin:.2em 0 .6em}h3{margin:1em 0 .4em}
.hero{background:linear-gradient(125deg,#0b3d6e,#0b5cad 55%,#2b8a3e);color:#fff;padding:26px;border-radius:16px;margin-bottom:16px}
.hero .tag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 12px;font-size:.8rem;margin-bottom:10px}
.hero h2{margin:0 0 6px;font-size:1.9rem}.hero p{margin:0;color:#e6f2fb}
.enc{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px solid var(--b);border-radius:12px;padding:12px;margin:12px 0;background:#f8fbff}
.enc .et{grid-column:1/-1;font-weight:700;color:var(--b);letter-spacing:.05em;font-size:.78rem}
.enc b{display:block;color:var(--m);font-size:.72rem;text-transform:uppercase}
.q{background:var(--bl);border-radius:12px;padding:12px 14px;margin:14px 0}
.card{border:1px solid var(--l);border-radius:12px;padding:12px 14px;margin:12px 0;background:#fcfdff}
label.l{display:block;font-weight:600;margin:12px 0 4px}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;padding:9px;border:1px solid var(--l);border-radius:8px;background:#fff}
textarea:focus,input:focus,select:focus{outline:2px solid var(--b)}
.row{display:grid;grid-template-columns:1fr 170px;gap:8px;align-items:end;margin:8px 0}
.row3{display:grid;grid-template-columns:1fr 170px 120px;gap:8px;align-items:end;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ch{border-radius:16px;padding:6px 11px;min-height:34px;font-size:.85rem;border:1px solid var(--m);background:#fff;color:var(--t)}
.ch.on{background:var(--b);border-color:var(--b);color:#fff}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.o{border:1px solid var(--l);background:#fff;border-radius:8px;padding:6px 11px;min-height:36px}
.o.sel{outline:2px solid var(--o)}
.o.ok{background:#e6f6e9;border-color:var(--g)}
.fb{margin-top:8px;font-size:.9rem;background:#fff;border-left:4px solid var(--b);padding:8px 10px;border-radius:6px}
.aud{border-left:5px solid var(--o);background:#fff4e6;padding:8px 12px;border-radius:8px;margin:10px 0}
.aud span{font-weight:700;color:#d9480f;font-size:.76rem;letter-spacing:.05em}
details{border:1px solid var(--l);border-radius:10px;padding:8px 12px;margin:10px 0;background:#fcfdff}
summary{cursor:pointer;font-weight:600;color:var(--b)}
details p{margin:6px 0 2px}
table{border-collapse:collapse;width:100%;margin:10px 0}
td,th{border:1px solid var(--l);padding:6px 8px;text-align:left;vertical-align:top;font-size:.9rem}
th{background:var(--bl)}
.odsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:10px 0}
.ods{border:1px solid var(--l);border-top:6px solid var(--c);border-radius:10px;padding:8px;background:#fff;text-align:left;color:var(--t);min-height:84px}
.ods b{display:block;color:var(--c);font-size:1.1rem}
.ods span{display:block;font-size:.8rem;line-height:1.25}
.det{border:1px solid var(--c);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fff}
.pf{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pf button{padding:5px 10px;min-height:34px}.pf button.on{background:var(--b);color:#fff}
.mx3{display:grid;grid-template-columns:110px repeat(3,1fr);gap:4px;margin:10px 0}
.mx3>div{min-height:64px;border-radius:6px;padding:4px;background:#f7fafc;border:1px solid #edf1f4}
.mx3 .mh{background:none;border:0;min-height:0;color:var(--m);font-weight:600;display:flex;align-items:center;font-size:.8rem}
.mx3 .mc{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.mx3 .mc span{display:inline-block;color:#fff;border-radius:10px;padding:1px 7px;font-weight:700;font-size:.8rem}
.tag{display:inline-block;background:var(--bl);color:var(--b);border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;margin-left:6px}
.doc h3{margin:.1em 0}.doc h4{color:var(--b);margin:14px 0 4px;border-bottom:1px solid var(--l)}
.doc p{margin:4px 0;white-space:pre-wrap}.doc .sg{border-top:2px solid var(--b);margin-top:14px;padding-top:8px;font-style:italic}
.nv{display:flex;justify-content:space-between;gap:8px;margin-top:22px}
.ck{display:flex;gap:8px;align-items:center;margin:10px 0}
.ck input{width:18px;height:18px}
.noprint{display:block}
@supports not (display:grid){.wrap{display:block}}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}.row,.row3{grid-template-columns:1fr}}
@media(max-width:600px){.enc{grid-template-columns:1fr}header b{width:100%}}
@media print{
 header,aside,.nv,.noprint{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 main{border:0;padding:0}
 body{background:#fff;font-size:12pt}
 .doc h3{font-size:16pt}table{font-size:9pt}
}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <b id="tt">UD3 · ODS y desempeño profesional</b>
  <select id="sel" onchange="go(+this.value)" aria-label="Ir a pantalla"></select>
  <div class="bar" aria-hidden="true"><i id="pg"></i></div>
  <span id="sv" class="m">Guardado ✓</span>
  <button class="sm" onclick="exportTxt()">TXT</button>
  <button class="sm" onclick="exportJson()">JSON</button>
  <button class="sm" onclick="document.getElementById('fi').click()">Importar</button>
  <button class="sm" onclick="resetAll()">Reiniciar</button>
</header>
<noscript><p style="padding:20px">Este cuaderno necesita JavaScript activado para guardar tu trabajo.</p></noscript>
<div class="wrap">
  <main id="m"></main>
  <aside id="ev"></aside>
</div>
<input type="file" id="fi" accept=".txt,.json" hidden>
<script>
/* ============ DATOS ============ */
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='sasp_ud3_motorbalear';
const SEC=['','Punto de partida','Criterios de credibilidad','Mapa de los 17 ODS','Observación y preselección','Retos → ODS','Riesgos y oportunidades','Matriz de materialidad','ODS prioritarios y exclusiones','Objetivos SMART','Acciones y alianzas','Compromiso personal y Mi Proyecto','Agenda y defensa'];
const ODS=[
 {n:1,name:'Fin de la pobreza',p:'Personas',c:'#e5243b',ex:'Empleo local, contratación y acceso al trabajo.'},
 {n:2,name:'Hambre cero',p:'Personas',c:'#dda63a',ex:'Poco material en un taller; se relaciona con el consumo responsable de la cadena.'},
 {n:3,name:'Salud y bienestar',p:'Personas',c:'#4c9f38',ex:'EPI, ergonomía y exposición a productos químicos.'},
 {n:4,name:'Educación de calidad',p:'Personas',c:'#c5192d',ex:'Formación técnica, FP dual y relevo generacional.'},
 {n:5,name:'Igualdad de género',p:'Personas',c:'#ff3a21',ex:'Mujeres en el sector y EPI adaptado a distintas tallas.'},
 {n:6,name:'Agua limpia y saneamiento',p:'Planeta',c:'#26bde2',ex:'Lavado de vehículos, vertidos y separadores de hidrocarburos.'},
 {n:7,name:'Energía asequible',p:'Prosperidad',c:'#fcc30b',ex:'LED, fotovoltaica, recarga y eficiencia del compresor.'},
 {n:8,name:'Trabajo decente',p:'Prosperidad',c:'#a21942',ex:'Empleo digno, seguridad y condiciones de trabajo.'},
 {n:9,name:'Industria e innovación',p:'Prosperidad',c:'#fd6925',ex:'Diagnosis, digitalización y formación en electromovilidad.'},
 {n:10,name:'Reducción de desigualdades',p:'Prosperidad',c:'#dd1367',ex:'Acceso a la formación y barreras económicas o territoriales.'},
 {n:11,name:'Ciudades sostenibles',p:'Prosperidad',c:'#fd9d24',ex:'Movilidad, ruido y relación del taller con el barrio.'},
 {n:12,name:'Producción y consumo responsables',p:'Planeta',c:'#bf8b2e',ex:'Residuos, recambios y economía circular.'},
 {n:13,name:'Acción por el clima',p:'Planeta',c:'#3f7e44',ex:'Emisiones y consumo energético del taller y de los vehículos.'},
 {n:14,name:'Vida submarina',p:'Planeta',c:'#0a97d9',ex:'Vertidos y microplásticos procedentes de neumáticos.'},
 {n:15,name:'Vida de ecosistemas terrestres',p:'Planeta',c:'#56c02b',ex:'Suelo, residuos y extracción de materiales.'},
 {n:16,name:'Paz, justicia e instituciones sólidas',p:'Paz',c:'#00689d',ex:'Transparencia, cumplimiento normativo y anticorrupción.'},
 {n:17,name:'Alianzas para lograr los objetivos',p:'Alianzas',c:'#19486a',ex:'Alianzas con FP, gestores de residuos y administración.'}
];
const P5=['Personas','Planeta','Prosperidad','Paz','Alianzas'];
const GW=[
 {t:'«Somos un taller 100% sostenible.»',a:2,why:'Un absoluto sin datos no se puede medir ni verificar.'},
 {t:'«Hemos reducido un 12% el consumo eléctrico en 2025; lo acredita la factura y el contador.»',a:0,why:'Cifra, año y evidencia: se puede comprobar.'},
 {t:'«Usamos productos ecológicos.»',a:1,why:'Falta qué producto, cuánto y con qué certificación.'},
 {t:'«En 2026 hemos entregado el 100% de los aceites usados a gestor autorizado, con documento de identificación.»',a:0,why:'Cifra, plazo, gestor y documento: es verificable.'},
 {t:'«Cuidamos el planeta.»',a:2,why:'Eslogan sin compromiso, sin cifra y sin plazo.'},
 {t:'«Formaremos a 3 técnicos en alta tensión antes de diciembre de 2027; presupuesto aprobado.»',a:0,why:'Cifra, plazo y recurso: se puede auditar.'}
];
const DEF_RETOS=['Residuos peligrosos','Contaminación y vertidos','Consumo energético','Electrificación y baterías','Falta de técnicos'];
function sugFor(r){
  const s=String(r).toLowerCase();
  if(s.indexOf('residuo')>=0)return ['12','12.5'];
  if(s.indexOf('contamina')>=0||s.indexOf('vertid')>=0)return ['6','6.3'];
  if(s.indexOf('energ')>=0||s.indexOf('consumo')>=0)return ['7','7.3'];
  if(s.indexOf('electrific')>=0||s.indexOf('bater')>=0)return ['9','9.4'];
  if(s.indexOf('técnic')>=0||s.indexOf('tecnic')>=0||s.indexOf('personal')>=0||s.indexOf('relevo')>=0)return ['4','4.4'];
  if(s.indexOf('segur')>=0||s.indexOf('epi')>=0)return ['8','8.8'];
  if(s.indexOf('igualdad')>=0||s.indexOf('mujer')>=0)return ['5','5.5'];
  if(s.indexOf('agua')>=0)return ['6','6.4'];
  if(s.indexOf('clima')>=0||s.indexOf('emision')>=0)return ['13','13.2'];
  return ['12','12.5'];
}
const STK=['Plantilla','Clientes','Vecindario','Administración','Gestores de residuos','Centros de FP','Proveedores','Dirección'];
const ALI=['Gestor autorizado','Centro de FP','Administración','Cliente o aseguradora','Proveedor','Asociación sectorial','Ninguno'];
const ASG=['A · Ambiental','S · Social','G · Gobernanza'];

/* ============ ESTADO ============ */
let S={a:{},p:0,v:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(x){}
if(!S.a||typeof S.a!=='object')S.a={};
['short','top','seen'].forEach(k=>{if(!Array.isArray(S.a[k]))S.a[k]=[];S.a[k]=S.a[k].map(String)});
if(!Array.isArray(S.a.retos))S.a.retos=[];
if(!Array.isArray(S.a.impPrio))S.a.impPrio=[];

function save(){try{localStorage.setItem(K,JSON.stringify(S));$('#sv').textContent='Guardado ✓'}catch(x){$('#sv').textContent='⚠ Exporta tu trabajo'}}
function val(k){return S.a[k]==null?'':S.a[k]}
function arr(k){return Array.isArray(S.a[k])?S.a[k]:[]}
function toast(msg){const s=$('#sv');s.textContent=msg;setTimeout(()=>{s.textContent='Guardado ✓'},2200)}

/* ============ COMPONENTES ============ */
function tx(k,l,ph=''){return `<label class="l">${e(l)}</label><input type="text" data-k="${k}" value="${e(val(k))}" placeholder="${e(ph)}">`}
function ta(k,l,rows=3,ph=''){return `<label class="l">${e(l)}</label><textarea data-k="${k}" rows="${rows}" placeholder="${e(ph)}">${e(val(k))}</textarea>`}
function sel(k,opts,l,ph='—'){
  const cur=String(val(k));
  const lab=l?`<label class="l">${e(l)}</label>`:'';
  return lab+`<select data-k="${k}"><option value="">${e(ph)}</option>`+
    opts.map(o=>{const v=Array.isArray(o)?o[0]:o,lab2=Array.isArray(o)?o[1]:o;
      return `<option value="${e(v)}"${cur===String(v)?' selected':''}>${e(lab2)}</option>`}).join('')+'</select>';
}
function chipsArr(k,items,max=0){
  const cur=arr(k).map(String);
  return `<div class="chips">`+items.map(it=>{
    const v=String(it.v),on=cur.includes(v);
    return `<button type="button" class="ch${on?' on':''}" title="${e(it.t||it.l)}" onclick="tgArr('${k}','${v}',${max})">${e(it.l)}</button>`;
  }).join('')+`</div>`;
}
function tgArr(k,v,max){
  let a=arr(k).map(String).slice();
  const i=a.indexOf(String(v));
  if(i>=0)a.splice(i,1);
  else{if(max&&a.length>=max){toast('Máximo '+max);return}a.push(String(v))}
  S.a[k]=a;render(1);
}
function chk(k,l){return `<label class="ck"><input type="checkbox" data-k="${k}"${val(k)?' checked':''}> <span>${e(l)}</span></label>`}

/* ============ PANTALLAS ============ */
function s1(){
  const prio=arr('impPrio').length?`<p><b>Prioridades importadas de UD2:</b></p><ul>${arr('impPrio').map(x=>`<li>${e(x)}</li>`).join('')}</ul>`:'';
  return `<div class="hero"><div class="tag">UD3 · Sesión 1 · El encargo</div><h2>De un diagnóstico a cinco compromisos</h2><p>MotorBalear ya sabe qué le pasa. Ahora necesita una agenda que pueda defender ante un cliente, un banco o una inspección.</p></div>
  <div class="enc"><div class="et">ENCARGO · AGENDA ODS 2027</div>
    <div><b>Cliente</b>MotorBalear S.L.</div><div><b>Equipo</b>Consultoría de sostenibilidad</div>
    <div><b>Punto de partida</b>Diagnóstico de UD2</div><div><b>Entregable</b>Agenda ODS 2027</div>
    <div><b>Objetivo</b>Elegir cinco ODS y convertirlos en objetivos medibles</div></div>
  <div class="card"><b>La dirección pide:</b> «No me traigas los 17 ODS. Dime en qué cinco nos jugamos algo y cómo vas a demostrar que lo estamos cumpliendo.»</div>
  ${tx('name','Tu nombre y grupo','Nombre y apellidos · grupo')}
  ${ta('proj','El problema de tu proyecto (UD1)',2,'¿Qué problema elegiste en la UD1?')}
  <div class="q"><b>¿Ya hiciste la UD2?</b><p class="m">Si exportaste tu diagnóstico, impórtalo: la agenda arrancará con tus prioridades.</p><button class="p" onclick="document.getElementById('fi').click()">📂 Importar JSON o TXT de UD2</button>${prio}</div>
  <details class="c" open><summary>Contexto rápido: por qué 2027</summary><p>Un objetivo sin plazo es un deseo. La agenda fija el horizonte 2027 para que el taller pueda medir avances antes de que acabe el curso y defenderlos con datos.</p></details>`;
}

function s2(){
  const labels=['Creíble','Incompleto','Greenwashing'];
  return `<p>Un ODS no es un adorno: es un compromiso que se puede auditar. Clasifica estas afirmaciones de talleres reales o plausibles.</p>`+
  GW.map((g,i)=>{
    const v=S.a['gw'+i];
    const fb=v!=null?`<div class="fb">${Number(v)===g.a?'✅ ':'❌ '}${e(g.why)}</div>`:'';
    return `<div class="q"><b>${i+1}. ${e(g.t)}</b><div class="opts">${labels.map((l,j)=>`<button type="button" class="o${Number(v)===j?' sel':''}${v!=null&&j===g.a?' ok':''}" onclick="gwSet(${i},${j})">${l}</button>`).join('')}</div>${fb}</div>`;
  }).join('')+
  `<div class="card"><h3>La regla de las 4 E</h3><p>Un compromiso creíble tiene <b>Exactitud</b> (una cifra), <b>Evidencia</b> (un documento), <b>Fecha</b> (un plazo) y <b>Encargado</b> (un responsable). Si falta una, no es sostenibilidad: es marketing.</p></div>`;
}
function gwSet(i,v){S.a['gw'+i]=v;render(1)}

function s3(){
  const pf=S.a.pf||'';
  const list=ODS.filter(o=>!pf||o.p===pf);
  const grid=list.map(o=>`<button type="button" class="ods" style="--c:${o.c}" onclick="openOds(${o.n})"><b>${o.n}</b><span>${e(o.name)}</span></button>`).join('');
  const o=ODS.find(x=>x.n==S.a.odsOpen);
  const det=o?`<div class="det" style="--c:${o.c}"><b>ODS ${o.n} · ${e(o.name)}</b><p class="m">${e(o.p)}</p><p>${e(o.ex)}</p></div>`:'<p class="m">Pulsa un ODS para ver su relación con el taller.</p>';
  return `<p>Los 17 ODS se agrupan en las <b>5P</b>. No hace falta memorizarlos: necesitas saber cuáles puede tocar un taller.</p>
  <div class="pf">${['','Personas','Planeta','Prosperidad','Paz','Alianzas'].map(p=>`<button type="button" class="${pf===p?'on':''}" onclick="setPF('${p}')">${p||'Todos'}</button>`).join('')}</div>
  <div class="odsg">${grid}</div>${det}
  <p class="m">Has explorado ${arr('seen').length}/17 ODS.</p>`;
}
function setPF(p){S.a.pf=p;render(1)}
function openOds(n){S.a.odsOpen=n;if(!arr('seen').includes(String(n)))S.a.seen=arr('seen').concat(String(n));render(1)}

function s4(){
  const obs=[1,2,3].map(i=>`<div class="row"><input type="text" data-k="obs${i}" value="${e(val('obs'+i))}" placeholder="Práctica observada: qué se hace y qué residuo o consumo implica"><select data-k="obsOds${i}"><option value="">ODS</option>${ODS.map(o=>`<option value="${o.n}"${String(val('obsOds'+i))===String(o.n)?' selected':''}>${o.n} · ${e(o.name)}</option>`).join('')}</select></div>`).join('');
  return `<p>Antes de elegir ODS, mira el taller. Recupera las tres prácticas que registraste como tarea previa (o hazlo ahora en dos minutos).</p>
  <div class="q"><b>Observación de campo</b><p class="m">Una práctica puede ser buena o mejorable; lo importante es qué ODS toca.</p>${obs}</div>
  <div class="q"><b>Preselección: elige entre 6 y 8 ODS</b><p class="m">Son los que un taller puede afectar de verdad. Llevas ${arr('short').length}/8.</p>${chipsArr('short',ODS.map(o=>({v:o.n,l:o.n,t:o.n+' · '+o.name})),8)}
  <p class="m">${arr('short').length?arr('short').map(n=>{const o=ODS.find(x=>x.n==n);return o?o.n+' · '+o.name:''}).join(' · '):'Pasa el cursor o consulta la pantalla 3 si dudas del número.'}</p></div>
  ${ta('shortWhy','Justifica los 3 ODS que más te importan',3,'Por qué esos y no otros...')}`;
}

function s5(){
  const retos=(arr('retos').length>=5?arr('retos'):DEF_RETOS).slice(0,5);
  return `<p>Cada reto del diagnóstico de UD2 tiene uno o dos ODS que lo explican. No hay una única respuesta: se evalúa la coherencia.</p>`+
  retos.map((r,i)=>{
    const cur=String(val('mapOds'+i));
    const sg=sugFor(r);
    return `<div class="q"><b>${i+1}. ${e(r)}</b><div class="row">
      <select data-k="mapOds${i}"><option value="">ODS</option>${ODS.map(o=>`<option value="${o.n}"${cur===String(o.n)?' selected':''}>${o.n} · ${e(o.name)}</option>`).join('')}</select>
      <input type="text" data-k="mapMeta${i}" value="${e(val('mapMeta'+i))}" placeholder="Meta (p. ej. 12.5)"></div>

function EVID(){
  const A=S.a,out=[];
  const add=(s,l,v)=>{if(v!=null&&String(v).trim())out.push({s:s,l:l,v:String(v).trim()})};
  add(1,'Alumno/a',A.name);add(1,'Proyecto UD1',A.proj);
  if(arr('impPrio').length)add(1,'Prioridades UD2',arr('impPrio').join(' · '));
  const gwOk=GW.map((g,i)=>A['gw'+i]!=null&&Number(A['gw'+i])===g.a).filter(Boolean).length;
  add(2,'Afirmaciones correctas',gwOk+' de '+GW.length);
  add(3,'ODS explorados',arr('seen').length?arr('seen').map(n=>'ODS '+n).join(', '):'');
  [1,2,3].forEach(i=>{if(val('obs'+i))add(4,'Práctica '+i,val('obs'+i)+(val('obsOds'+i)?' → ODS '+val('obsOds'+i):''))});
  add(4,'ODS preseleccionados',arr('short').length?arr('short').join(', '):'');
  add(4,'Justificación',A.shortWhy);
  const retos=(arr('retos').length>=5?arr('retos'):DEF_RETOS).slice(0,5);
  retos.forEach((r,i)=>{if(val('mapOds'+i))add(5,r,'ODS '+val('mapOds'+i)+(val('mapMeta'+i)?' · meta '+val('mapMeta'+i):''))});
  (arr('top').length>=3?arr('top'):arr('short').slice(0,3)).forEach(n=>{
    if(val('risk_'+n))add(6,'ODS '+n+' · riesgo',val('risk_'+n));
    if(val('opp_'+n))add(6,'ODS '+n+' · oportunidad',val('opp_'+n));
    if(val('stk_'+n))add(6,'ODS '+n+' · stakeholder',val('stk_'+n));
  });
  add(7,'Matriz',arr('short').map(n=>n+': I'+(val('mi_'+n)||'-')+' E'+(val('me_'+n)||'-')).join(' · '));
  add(7,'Prioritarios',arr('top').length?arr('top').join(', '):'');
  [1,2,3].forEach(i=>add(8,'Exclusión '+i,A['out'+i]));
  if(val('projOds'))add(8,'Mi Proyecto', 'ODS '+val('projOds')+(val('projWhy')?' · '+val('projWhy'):''));
  arr('top').forEach(n=>{if(val('mt_'+n))add(9,'ODS '+n+' · objetivo',val('mt_'+n)+(val('ind_'+n)?' · '+val('ind_'+n):''))});
  arr('top').forEach(n=>{if(val('acc_'+n))add(10,'ODS '+n+' · acción',val('acc_'+n)+(val('ali_'+n)?' · '+val('ali_'+n):''))});
  [1,2].forEach(i=>add(11,'Compromiso '+i,val('pc'+i)));
  add(12,'Defensa',[val('def1'),val('def2'),val('def3')].filter(Boolean).join(' · '));
  return out;
}

  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});

function importUD2(j){
  if(j.alumno)S.a.name=j.alumno;
  S.a.impPrio=Array.isArray(j.prioridades)?j.prioridades:[];
  S.a.impDiag=j.diagnostico||{};
  const base=(j.prioridades&&j.prioridades.length?j.prioridades:DEF_RETOS).slice(0,5);
  S.a.retos=base.length>=5?base:DEF_RETOS;
  norm();render();toast('UD2 importada: '+S.a.impPrio.length+' prioridades');
}
function onFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let t=String(r.result).trim(),j=null;
      if(t.charAt(0)==='{')j=JSON.parse(t);
      else if(t.indexOf('[[DATOS]]')>=0)j={datos:JSON.parse(t.split('[[DATOS]]')[1])};
      if(!j)throw new Error('formato');
      if(j.unidad==='UD2'||Array.isArray(j.prioridades)){importUD2(j);return}
      if(j.datos&&!j.unidad&&(j.datos.mi0!=null||j.datos.w_f0!=null||j.datos.c4_c!=null)){alert('Ese TXT es de la UD2 y no incluye las prioridades. Importa el JSON de la UD2.');return}
      const d=j.datos||j;
      if(!d||typeof d!=='object')throw new Error('datos');
      S.a=d;norm();S.p=0;render();toast('Trabajo importado');
    }catch(x){alert('Archivo no válido: usa un TXT o JSON exportado desde UD2 o UD3.')}
  };
  r.readAsText(f);ev.target.value='';
}

}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.tagName==='SELECT'||t.type==='checkbox')return;
  onEdit(t);
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.tagName==='SELECT'||t.type==='checkbox')onEdit(t);
});
function onEdit(t){
  const k=t.dataset&&t.dataset.k;if(!k)return;
  if(t.type==='checkbox')S.a[k]=t.checked?(k==='firma'?new Date().toISOString().slice(0,10):1):'';
  else S.a[k]=t.value;
  save();
  if(k==='firma'){render(1);return}
  if(/^(mi_|me_)/.test(k)){render(1);return}
  updEv();
}
$('#fi').onchange=onFile;

$('#tt').innerHTML='UD3 · ODS y desempeño profesional <span class="m">v1.0</span>';
if(S.p==null||S.p<0||S.p>=SCR.length)S.p=0;
norm();
render(1);
